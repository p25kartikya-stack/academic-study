<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Study</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172339;background:#f4f7fb}body{margin:0;padding:24px}.wrap{max-width:800px;margin:3vh auto;background:white;padding:clamp(20px,5vw,42px);border-radius:18px;box-shadow:0 10px 40px #142b4815}h1{margin-top:0}p{line-height:1.55;color:#48566c}.image-box{text-align:center;background:#f8f9fb;border-radius:12px;overflow:hidden}#study-image{display:block;max-width:100%;width:auto;height:auto;max-height:70vh;max-height:70svh;margin:auto;object-fit:contain}button{border:0;border-radius:9px;padding:13px 18px;background:#155bd6;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}#error{color:#a12d20}#loading{padding:40px 0;text-align:center}[hidden]{display:none!important}
</style>
</head>
<body><main class="wrap">
<h1>Image study</h1>
<p>Please look carefully at the image. After at least 3 seconds, you can continue to the questionnaire.</p>
<div id="loading" role="status">Loading image…</div>
<div class="image-box"><img id="study-image" alt="Study advertisement" hidden></div>
<p id="status" role="status" aria-live="polite">Preparing your image.</p>
<p id="error" role="alert"></p>
<button id="continue" type="button" disabled>Continue to questionnaire</button>
<noscript><p>Please enable JavaScript to participate in this study.</p></noscript>
</main>
<script>
'use strict';
const SURVEY_URL='https://qualtricsxmhkyq2p2l3.qualtrics.com/jfe/form/SV_dg7ERBZTKsc9av4';
const IMAGES={A:'images/A.jpg',B:'images/B.png',C:'images/C.png',D:'images/D.png',E:'images/E.png',F:'images/F.png'};
const STORAGE_KEY='imageStudyCondition-v1';
const MIN_VIEW_MS=3000;
const image=document.getElementById('study-image');
const loading=document.getElementById('loading');
const statusEl=document.getElementById('status');
const errorEl=document.getElementById('error');
const nextBtn=document.getElementById('continue');
const keys=Object.keys(IMAGES);
function randomIndex(n){
  if(window.crypto && window.crypto.getRandomValues){
    const values=new Uint32Array(1);
    const limit=Math.floor(4294967296/n)*n;
    do{window.crypto.getRandomValues(values);}while(values[0]>=limit);
    return values[0]%n;
  }
  return Math.floor(Math.random()*n);
}
// Keep one assignment through refreshes in this tab. Use a new key for this image study.
let condition;
try{condition=sessionStorage.getItem(STORAGE_KEY);}catch(e){}
if(!Object.prototype.hasOwnProperty.call(IMAGES,condition)){
  condition=keys[randomIndex(keys.length)];
  try{sessionStorage.setItem(STORAGE_KEY,condition);}catch(e){}
}
const destination=new URL(SURVEY_URL);
destination.searchParams.set('Condition',condition);
let loaded=false,ready=false,elapsed=0,visibleSince=null,timer=null;
function updateTimer(){
  const now=performance.now();
  if(visibleSince!==null){elapsed+=now-visibleSince;visibleSince=null;}
  clearTimeout(timer);
  if(!loaded || ready)return;
  if(elapsed>=MIN_VIEW_MS){
    ready=true;nextBtn.disabled=false;
    statusEl.textContent='You may now continue to the questionnaire.';
    return;
  }
  if(document.hidden){statusEl.textContent='Return to this tab to finish viewing the image.';return;}
  visibleSince=now;
  statusEl.textContent='Please view the image for '+Math.ceil((MIN_VIEW_MS-elapsed)/1000)+' more second(s).';
  timer=setTimeout(updateTimer,Math.min(250,MIN_VIEW_MS-elapsed));
}
image.addEventListener('load',()=>{
  if(!image.naturalWidth)return;
  loading.hidden=true;image.hidden=false;
  // Start counting after the image has had an opportunity to paint.
  requestAnimationFrame(()=>requestAnimationFrame(()=>{loaded=true;updateTimer();}));
},{once:true});
image.addEventListener('error',()=>{
  loading.hidden=true;image.hidden=true;nextBtn.disabled=true;
  statusEl.textContent='Image unavailable.';
  errorEl.textContent='The image could not load. Please check your connection and refresh, or contact the study organizer.';
});
document.addEventListener('visibilitychange',updateTimer);
nextBtn.addEventListener('click',()=>{if(ready)window.location.assign(destination.href);});
image.src=IMAGES[condition];
</script>
</body>
</html>
